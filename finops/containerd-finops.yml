description: 'FOCUS-aligned FinOps for Containerd: CNCF-graduated OSS runtime with no per-call or license
  cost. FinOps focuses on the underlying compute / storage / network it consumes (Kubernetes node hours,
  registry-pull egress) rather than a vendor invoice from containerd itself.'
