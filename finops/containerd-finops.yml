  InvoiceIssuerName: Not Applicable
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: node_hours
    description: Compute hours of nodes running containerd (proxy meter — billed by the underlying cloud
      provider, not by containerd)
    unit: instance-hour
    aggregation: sum
    dimensions:
      - cloud_provider
      - instance_type
      - cluster
  - name: image_pull_egress
    description: Egress from container registries during image pulls
    unit: GB
    aggregation: sum
    dimensions:
      - registry
      - region
  - name: container_runtime_count
    description: Containers / pods executed via the containerd CRI surface (operational meter, no charge)
    unit: container
    aggregation: count
    dimensions:
      - namespace
      - cluster
principles:
  - name: Visibility
    description: Containerd does not produce invoices; surface infrastructure cost via the underlying
      cloud provider's billing exports and via Prometheus metrics scraped from the kubelet / containerd.
  - name: Allocation
    description: Allocate via cluster / namespace / pod labels and cloud-provider node tags; align with
      Kubecost or OpenCost for per-workload mapping.
  - name: Optimization
    description: Reduce image-pull egress with registry mirrors / pull-through caches; tune `max_concurrent_downloads`;
      consider lazy-loading snapshotters (stargz) for large images; right-size node pools.
  - name: Accountability
    description: Platform / SRE teams own cluster-level spend; product teams own per-namespace footprint
      and image hygiene that drives storage and pull egress.
