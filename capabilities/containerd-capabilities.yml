# Naftiko capabilities profile for containerd.
# Capabilities cover the containerd metrics HTTP endpoint - the only
# REST/HTTP-style surface among containerd's APIs. The gRPC, CRI, and
# NRI services are not modeled here because they are not REST/JSON
# APIs and are better consumed via their native protocol buffers.
provider: containerd
name: Containerd
description: >-
  containerd is the CNCF graduated container runtime that powers
  Docker, Kubernetes (via CRI), and other higher-level tooling. The
  metrics endpoint is the public HTTP surface; other functionality is
  exposed via the containerd gRPC API, the Kubernetes CRI, and the
  Node Resource Interface (NRI).
capabilities:
  - id: containerd.metrics.scrape
    name: Scrape Prometheus metrics
    description: Scrape Prometheus-format runtime metrics from the containerd metrics endpoint.
    api: containerd:containerd-metrics-api
    inputs:
      - host
      - port
    outputs:
      - prometheus_text

  - id: containerd.metrics.health-check
    name: Probe metrics endpoint
    description: Verify the containerd metrics HTTP server is reachable on the configured address.
    api: containerd:containerd-metrics-api
    inputs:
      - host
      - port
    outputs:
      - status_code
