- aid: containerd:containerd-cri-api
  name: Containerd CRI API
  description: >-
    Container Runtime Interface (CRI) implementation that enables Kubernetes to use containerd as its
    container runtime. Supports pod sandbox management, container lifecycle operations, image pulling,
    and streaming APIs for exec, attach, and port-forward.
  humanURL: https://github.com/containerd/containerd/tree/main/pkg/cri
  properties:
  - type: Documentation
