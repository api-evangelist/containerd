- aid: containerd:containerd-nri-api
  name: Containerd NRI API
  description: >-
    The Node Resource Interface (NRI) is a framework for plugging extensions into OCI-compatible container
    runtimes. NRI plugins receive lifecycle event notifications and can make controlled modifications
    to container configurations before creation, enabling domain-specific resource management without
    modifying the runtime itself.
  humanURL: https://github.com/containerd/nri
  properties:
