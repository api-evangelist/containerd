description: Containerd is a CNCF-graduated open-source container runtime distributed under the Apache
  License 2.0. Its gRPC API (containers, images, content, snapshots, tasks, namespaces, leases, events,
  plugins) is exposed locally by the containerd daemon via Unix socket / gRPC; there is no commercial
  offering, no per-call price, and no SaaS service. Operational cost lives in the host infrastructure
  that runs containerd (Kubernetes nodes, container hosts, registries).
